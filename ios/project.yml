# XcodeGen 설정:  brew install xcodegen && xcodegen generate  → VolumePPT.xcodeproj 생성
name: VolumePPT
options:
  bundleIdPrefix: com.volumeppt
  deploymentTarget:
    iOS: "15.0"
targets:
  VolumePPT:
    type: application
    platform: iOS
    sources: [VolumePPT]
    info:
      path: VolumePPT/Info.plist
      properties:
        CFBundleDisplayName: VolumePPT
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: 같은 Wi-Fi 에 있는 PC 로 슬라이드 넘김 신호를 보내기 위해 필요합니다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.volumeppt.remote
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO

name: Build VolumePPT

on:
  push:
    paths: ["android/**", "pc/**", "shortcuts/**", ".github/workflows/build.yml"]
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../VolumePPT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Android
          path: VolumePPT.apk

  # PC 실행기: 안드로이드 APK 를 실행 파일 안에 넣어서, 휴대폰이 PC 에서 바로 앱을 받을 수 있게 한다
  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VolumePPT-Android
          path: pc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VolumePPT.exe
        working-directory: pc
        run: |
          move VolumePPT.apk app.apk
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name VolumePPT --add-data "app.apk:." VolumePPT.py
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Windows
          path: pc/dist/VolumePPT.exe

  macos:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VolumePPT-Android
          path: pc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VolumePPT.app
        working-directory: pc
        run: |
          mv VolumePPT.apk app.apk
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --windowed --name VolumePPT --collect-submodules pynput --add-data "app.apk:." VolumePPT.py
          cd dist && ditto -c -k --keepParent VolumePPT.app VolumePPT-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Mac
          path: pc/dist/VolumePPT-mac.zip

  # main 에 반영되거나, 태그를 올리거나, Actions 에서 직접 실행하면 Releases 에 올린다.
  # README 의 다운로드 링크(releases/latest/download/...)가 항상 최신 파일을 가리키게 된다.
  # 아이폰 단축어: iOS 15 이상은 Apple 서명이 된 단축어만 가져올 수 있어서 Mac 에서 서명한다
  shortcuts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign shortcuts
        run: |
          sw_vers
          python3 shortcuts/make_shortcuts.py build
          mkdir -p signed
          for f in build/*.shortcut; do
            shortcuts sign --mode anyone --input "$f" --output "signed/$(basename "$f")"
          done
          ls -la signed
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Shortcuts
          path: signed/*.shortcut


    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [android, windows, macos, shortcuts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            VolumePPT.exe
            VolumePPT-mac.zip
            VolumePPT.apk
            VolumePPT-next.shortcut
            VolumePPT-prev.shortcut

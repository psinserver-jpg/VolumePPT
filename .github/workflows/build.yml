name: Build VolumePPT

on:
  push:
    paths: ["android/**", "pc/**", ".github/workflows/build.yml"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../VolumePPT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Android
          path: VolumePPT.apk

  # PC 실행기: 안드로이드 APK 를 실행 파일 안에 넣어서, 휴대폰이 PC 에서 바로 앱을 받을 수 있게 한다
  windows:
    needs: android
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VolumePPT-Android
          path: pc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VolumePPT.exe
        working-directory: pc
        run: |
          move VolumePPT.apk app.apk
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --onefile --windowed --name VolumePPT --add-data "app.apk:." VolumePPT.py
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Windows
          path: pc/dist/VolumePPT.exe

  macos:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VolumePPT-Android
          path: pc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build VolumePPT.app
        working-directory: pc
        run: |
          mv VolumePPT.apk app.apk
          python -m pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --windowed --name VolumePPT --collect-submodules pynput --add-data "app.apk:." VolumePPT.py
          cd dist && ditto -c -k --keepParent VolumePPT.app VolumePPT-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: VolumePPT-Mac
          path: pc/dist/VolumePPT-mac.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            VolumePPT.exe
            VolumePPT-mac.zip
            VolumePPT.apk
